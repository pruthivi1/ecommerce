version: "3.8"

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: marketbridge_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: marketbridge
      MYSQL_USER: marketbridge_app
      MYSQL_PASSWORD: marketbridge_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js + Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketbridge_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: marketbridge
      DATABASE_USER: marketbridge_app
      DATABASE_PASSWORD: marketbridge_password
      DATABASE_SSL: "false"
      JWT_SECRET: super_secure_production_jwt_secret_marketbridge_2026_xyz
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost,http://localhost:80,http://localhost:5173
      ALLOW_DEMO_LOGIN: "true"
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      DEFAULT_GST_RATE: 0.18
      DEFAULT_COMMISSION_RATE: 0.08
      SHIPPING_FEE_PER_VENDOR: 300
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/public/uploads
    command: >
      sh -c "node src/database/migrate.js && node src/database/seed.js && node src/server.js"

  # React + Vite Frontend (served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketbridge_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
